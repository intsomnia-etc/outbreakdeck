<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Status autentikasi Outbreak Decks." />
  <title>Verify Account — Outbreak Decks</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, sans-serif;
      color: #252525;
      background: #fff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      padding: 32px 20px;
      place-items: center;
    }

    main {
      width: min(100%, 520px);
      text-align: center;
    }

    .logo {
      display: block;
      width: min(360px, 80vw);
      height: auto;
      margin: 0 auto 36px;
    }

    .status-icons {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      margin-bottom: 24px;
    }

    .yvette,
    .status-icon {
      display: block;
      width: 112px;
      height: 112px;
      object-fit: contain;
    }

    .status-icon[hidden] {
      display: none;
    }

    h1 {
      margin: 0;
      font-size: clamp(20px, 5vw, 26px);
      line-height: 1.4;
    }

    .success {
      color: #16843b;
    }

    .failure {
      color: #c62828;
    }

    .back-link {
      display: inline-block;
      margin-top: 28px;
      padding: 12px 22px;
      border-radius: 6px;
      background: #252525;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      transition: background-color .15s ease;
    }

    .back-link:hover,
    .back-link:focus-visible {
      background: #444;
    }

    @media (max-width: 360px) {
      .yvette,
      .status-icon {
        width: 96px;
        height: 96px;
      }
    }
  </style>
</head>
<body>
  <main>
    <img
      class="logo"
      src="assets/images/login-page-logo.png"
      alt="Outbreak Decks"
    />

    <div class="status-icons" aria-hidden="true">
      <img class="yvette" id="statusCharacter" src="assets/images/yvette.png" alt="" />
      <svg class="status-icon success" id="statusIcon" viewBox="0 0 112 112" fill="none">
        <circle cx="56" cy="56" r="48" stroke="currentColor" stroke-width="8" />
        <path id="statusMark" d="m31 57 17 17 34-36" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </div>

    <h1 class="success" id="statusMessage" role="status">
      Account successfully created, please return to the website and log in.
    </h1>

    <a class="back-link" href="https://intsomnia.com/outbreakdecks/">
      Back to website
    </a>
  </main>

  <script>
    const query = new URLSearchParams(window.location.search);
    const hash = new URLSearchParams(window.location.hash.slice(1));
    const authError =
      query.has("error") ||
      query.has("error_code") ||
      query.has("error_description") ||
      hash.has("error") ||
      hash.has("error_code") ||
      hash.has("error_description");
    const hasAuthResult =
      hash.has("access_token") ||
      query.has("code") ||
      query.get("type") === "signup" ||
      hash.get("type") === "signup";

    if (authError || !hasAuthResult) {
      const message = document.querySelector("#statusMessage");
      message.textContent = "Failed to create an account, please try again.";
      message.classList.replace("success", "failure");
      document.querySelector("#statusCharacter").src = "assets/images/yvette2.png";
      document.querySelector("#statusIcon").remove();
    }

    if (hasAuthResult || authError) {
      window.history.replaceState({}, document.title, window.location.pathname);
    }
  </script>
</body>
</html>
